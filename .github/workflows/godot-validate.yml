name: Godot Validate

on:
  push:
    branches:
      - prototype/playable-shop-loop
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Import and parse project
        run: /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --quit-after 3

      - name: Boot main scene
        run: /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 5
